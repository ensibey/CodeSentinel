name: "CodeSentinel Security Audit"
description: "Run deterministic Python AST OWASP/CWE security checks and emit text, JSON, Markdown, or SARIF 2.1.0 reports."
author: "Enis Doğan"

branding:
  icon: "shield"
  color: "blue"

inputs:
  target:
    description: "Directory or Python file to scan"
    required: false
    default: "."
  format:
    description: "Output format: text, json, sarif, or markdown"
    required: false
    default: "text"
  fail-on:
    description: "Minimum severity threshold that causes a non-zero exit code (LOW, MEDIUM, HIGH, CRITICAL, NONE)"
    required: false
    default: "HIGH"
  output:
    description: "Optional file path to save the report (e.g., codesentinel.sarif)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install CodeSentinel core dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pydantic pydantic-settings

    - name: Run CodeSentinel scan
      shell: bash
      run: |
        ARGS="${{ inputs.target }} --format ${{ inputs.format }} --fail-on ${{ inputs.fail-on }}"
        if [ -n "${{ inputs.output }}" ]; then
          ARGS="$ARGS --output ${{ inputs.output }}"
        fi
        PYTHONPATH="${{ github.action_path }}" python -m src.cli $ARGS
