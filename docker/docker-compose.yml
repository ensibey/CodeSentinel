version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: codesentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sentinel-net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: codesentinel-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sentinel-net
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: codesentinel-worker
    env_file:
      - ../.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sentinel-net
    command: ["python", "-m", "src.queue.worker"]

volumes:
  redis_data:

networks:
  sentinel-net:
    driver: bridge
