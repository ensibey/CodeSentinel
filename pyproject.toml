[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codesentinel"
version = "0.2.0"
description = "Hybrid Python AST + Multi-Agent LangGraph Security Scanner & PR Reviewer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Enis Doğan", email = "enis-dogan@outlook.com"}
]
keywords = ["github", "pull-request", "security", "sast", "sarif", "ai-agents", "langgraph", "fastapi"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "redis>=5.0.0",
    "arq>=0.25.0",
    "PyGithub>=2.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
]

[project.scripts]
codesentinel = "src.cli:main"

[project.urls]
Homepage = "https://github.com/ensibey/CodeSentinel"
Repository = "https://github.com/ensibey/CodeSentinel"
Issues = "https://github.com/ensibey/CodeSentinel/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.optional-dependencies]
agents = [
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis[json]>=2.21.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
